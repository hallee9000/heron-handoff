name: deploy-to-static-sites

on:
  push:
    branches:
      - master

# The Pages action pushes the generated site to the gh-pages branch.  Grant the
# workflow token write access explicitly; repository/org defaults may be
# read-only.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-node@v1
      with:
        node-version: '15.x'
    - run: npm install
    - run: echo PUBLIC_URL=. > ./.env
    - run: echo IMAGE_INLINE_SIZE_LIMIT=100000 >> ./.env
    - run: npm run build
    - name: GitHub Pages
      uses: crazy-max/ghaction-github-pages@v1.2.5
      with:
        build_dir:  build
      env:
        # Use the installation token scoped to this repository instead of a
        # personal-access-token secret, which can lack access to this fork.
        GITHUB_TOKEN: ${{ github.token }}
    - name: Deploy static to Tencent COS
      env:
        COSCLI_VERSION: v1.0.8
        COS_SECRET_ID: ${{ secrets.SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.SECRET_KEY }}
        COS_BUCKET: ${{ secrets.COS_BUCKET }}
        COS_REGION: ${{ secrets.COS_REGION }}
      run: |
        curl --fail --location --retry 3 \
          --output coscli \
          "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/coscli-linux-amd64"
        chmod +x coscli
        ./coscli --version
        ./coscli sync build/ "cos://${COS_BUCKET}/" \
          --recursive --delete --force \
          --init-skip=true \
          --secret-id "${COS_SECRET_ID}" \
          --secret-key "${COS_SECRET_KEY}" \
          --endpoint "cos.${COS_REGION}.myqcloud.com"
    - name: Deploy static to Tencent CloudBase
      id: deployStatic
      uses: TencentCloudBase/cloudbase-action@v1.1.1
      with:
        secretId: ${{ secrets.SECRET_ID }}
        secretKey: ${{ secrets.SECRET_KEY }}
        envId: ${{ secrets.ENV_ID }}
        staticSrcPath: build
