name: deploy-to-static-sites

on:
  push:
    branches:
      - master

# The Pages action pushes the generated site to the gh-pages branch.  Grant the
# workflow token write access explicitly; repository/org defaults may be
# read-only.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-node@v1
      with:
        node-version: '15.x'
    - run: npm install
    - run: echo PUBLIC_URL=. > ./.env
    - run: echo IMAGE_INLINE_SIZE_LIMIT=100000 >> ./.env
    - run: npm run build
    - name: GitHub Pages
      uses: crazy-max/ghaction-github-pages@v1.2.5
      with:
        build_dir:  build
      env:
        # Use the installation token scoped to this repository instead of a
        # personal-access-token secret, which can lack access to this fork.
        GITHUB_TOKEN: ${{ github.token }}
    - name: Deploy static to Tencent COS
      uses: sylingd/tencent-cos-and-cdn-action@v1
      with:
        secret_id: ${{ secrets.SECRET_ID }}
        secret_key: ${{ secrets.SECRET_KEY }}
        cos_bucket: ${{ secrets.COS_BUCKET }}
        cos_region: ${{ secrets.COS_REGION }}
        local_path: build
        remote_path: /
        clean: true
    - name: Deploy static to Tencent CloudBase
      id: deployStatic
      uses: TencentCloudBase/cloudbase-action@v1.1.1
      with:
        secretId: ${{ secrets.SECRET_ID }}
        secretKey: ${{ secrets.SECRET_KEY }}
        envId: ${{ secrets.ENV_ID }}
        staticSrcPath: build
